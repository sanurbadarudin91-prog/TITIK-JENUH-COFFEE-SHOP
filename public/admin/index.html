<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Masuk · Panel Admin Titik Jenuh</title>
<link rel="icon" href="../assets/logo.png" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style>
</head>
<body class="min-h-screen bg-stone-900 flex items-center justify-center p-4">

  <!-- Gerbang tersembunyi: halaman admin hanya terbuka lewat token di kolom cari -->
  <script>
    if (sessionStorage.getItem('tj_gate') !== '1') {
      window.location.replace('../404');
    }
  </script>

  <div id="loginCard" class="w-full max-w-md">

    <div class="text-center mb-6">
      <img src="../assets/logo.png" alt="Logo" class="w-20 h-20 rounded-full object-cover mx-auto bg-stone-800 mb-3"
           onerror="this.style.display='none'" />
      <h1 class="text-2xl font-bold text-white tracking-wide">TITIK JENUH</h1>
      <p class="text-stone-400 text-sm">Panel Admin · Akses Terbatas</p>
    </div>

    <form id="loginForm" class="bg-white rounded-2xl shadow-2xl p-6 md:p-8 space-y-4">
      <h2 class="text-xl font-bold text-stone-900">Masuk Dashboard</h2>
      <p class="text-sm text-stone-500 -mt-2">Hanya untuk pengelola kafe.</p>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1">Username</label>
        <input id="lUsername" type="text" required autocomplete="username"
               class="w-full rounded-xl border border-stone-300 px-4 py-3 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1">Email</label>
        <input id="lEmail" type="email" required autocomplete="email"
               class="w-full rounded-xl border border-stone-300 px-4 py-3 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1">Password</label>
        <input id="lPassword" type="password" required autocomplete="current-password"
               class="w-full rounded-xl border border-stone-300 px-4 py-3 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none" />
      </div>

      <button type="submit" id="loginBtn"
              class="w-full bg-amber-500 hover:bg-amber-600 text-stone-900 font-bold py-3 rounded-xl transition disabled:opacity-60">
        Masuk
      </button>

      <p id="loginMsg" class="text-sm text-center text-red-600 min-h-[1.25rem]"></p>
    </form>

    <p class="text-center text-stone-500 text-xs mt-6">
      <a href="../" class="hover:text-stone-300">← Kembali ke website</a>
    </p>
  </div>

  <!-- Layar transisi setelah login berhasil -->
  <div id="redirectCard" class="hidden text-center">
    <div class="w-14 h-14 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
    <p class="text-white font-medium">Login berhasil — membuka dashboard...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
